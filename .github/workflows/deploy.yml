name: Deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: production
    timeout-minutes: 25
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_KEY: ${{ secrets.EC2_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify release inputs
        run: |
          set -euo pipefail
          for name in DOCKERHUB_USER DOCKERHUB_TOKEN EC2_HOST EC2_USER EC2_KEY SSH_KNOWN_HOSTS; do
            test -n "${!name}" || { echo "Missing production secret: $name"; exit 1; }
          done
          [[ "$DOCKERHUB_USER" =~ ^[a-z0-9_-]+$ ]]
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
      - run: npm ci
      - run: npm test
      - name: Build and smoke-test image
        run: |
          set -euo pipefail
          IMAGE="$DOCKERHUB_USER/smart-health:sha-$GITHUB_SHA"
          docker build -t "$IMAGE" .
          docker run -d --name smoke -p 127.0.0.1:3000:3000 "$IMAGE"
          trap 'docker rm -f smoke >/dev/null' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/health | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{if(JSON.parse(s).status!=='ok')process.exit(1)})"
          curl -fsS http://127.0.0.1:3000/ >/dev/null
      - name: Publish immutable release reference
        run: |
          set -euo pipefail
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
          docker push "$DOCKERHUB_USER/smart-health:sha-$GITHUB_SHA"
          docker logout
      - name: Deploy through verified SSH
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes"
          ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" 'test -d /opt/branchline && test -f /opt/branchline/runtime.env && test -f /opt/branchline/.env'
          scp $SSH_OPTS deploy/compose.yml deploy/Caddyfile scripts/deploy.sh "$EC2_USER@$EC2_HOST:/opt/branchline/"
          ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" "cd /opt/branchline && bash deploy.sh '$DOCKERHUB_USER/smart-health:sha-$GITHUB_SHA' '$GITHUB_SHA'"
