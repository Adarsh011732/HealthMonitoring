name: branchline
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to a versioned image}
    restart: unless-stopped
    env_file: runtime.env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  monitor:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    command: [node, /app/scripts/monitor.mjs]
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      MONITOR_URL: http://app:3000/health
    env_file: runtime.env
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('fs');process.exit(Date.now()-fs.statSync('/data/monitor.json').mtimeMs<120000?0:1)",
        ]
      interval: 60s
      start_period: 60s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set your domain or http://IP for testing}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  caddy_data:
  caddy_config:
